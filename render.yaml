services:
  - type: web
    name: creator-intelligence-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: INFLUENCERS_TOKEN
        sync: false
        value: 692aac1c64331ae91ffcb8b73a664d999fe05b53
      - key: PYTHON_VERSION
        value: 3.11.0

